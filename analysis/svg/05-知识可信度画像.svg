<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="m5" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="980" height="560" fill="#ffffff"/>
  <text x="24" y="36" font-size="21" font-weight="700" fill="#0f172a">知识可信度画像：八维度评级</text>
  <text x="24" y="58" font-size="12.5" fill="#64748b">「算得准，但说得不清楚，且没说清自己是怎么算的」</text>

  <!-- radar-ish bar chart -->
  <text x="24" y="92" font-size="13.5" font-weight="700" fill="#0f172a">维度评分（A+ 最优 / C 最差）</text>
  <g font-size="12">
    <!-- row template: label | bar | grade -->
    <text x="24" y="124" fill="#0f172a" font-weight="600">飞星 / 山向 / 局型算法</text>
    <rect x="230" y="112" width="480" height="18" rx="4" fill="#f1f5f9"/>
    <rect x="230" y="112" width="480" height="18" rx="4" fill="#16a34a"/>
    <text x="722" y="126" font-size="14" font-weight="800" fill="#15803d">A</text>
    <text x="760" y="126" font-size="11" fill="#64748b">洛书路径 / 元龙阴阳 / 五气 / 替卦歌诀全对</text>

    <text x="24" y="158" fill="#0f172a" font-weight="600">流年紫白</text>
    <rect x="230" y="146" width="480" height="18" rx="4" fill="#f1f5f9"/>
    <rect x="230" y="146" width="480" height="18" rx="4" fill="#16a34a"/>
    <text x="722" y="160" font-size="14" font-weight="800" fill="#15803d">A</text>
    <text x="760" y="160" font-size="11" fill="#64748b">2019-2036 严格递推无错</text>

    <text x="24" y="192" fill="#0f172a" font-weight="600">八宅大游年</text>
    <rect x="230" y="180" width="480" height="18" rx="4" fill="#f1f5f9"/>
    <rect x="230" y="180" width="444" height="18" rx="4" fill="#22c55e"/>
    <text x="722" y="194" font-size="14" font-weight="800" fill="#16a34a">A-</text>
    <text x="760" y="194" font-size="11" fill="#64748b">表结构与立春换年正确；扣分在命卦口径</text>

    <text x="24" y="226" fill="#0f172a" font-weight="600">城门诀</text>
    <rect x="230" y="214" width="480" height="18" rx="4" fill="#f1f5f9"/>
    <rect x="230" y="214" width="444" height="18" rx="4" fill="#22c55e"/>
    <text x="722" y="228" font-size="14" font-weight="800" fill="#16a34a">A-</text>
    <text x="760" y="228" font-size="11" fill="#64748b">候选推导正确，但前端只显示一句 summary</text>

    <text x="24" y="260" fill="#0f172a" font-weight="600">提示词知识严谨性</text>
    <rect x="230" y="248" width="480" height="18" rx="4" fill="#f1f5f9"/>
    <rect x="230" y="248" width="384" height="18" rx="4" fill="#84cc16"/>
    <text x="722" y="262" font-size="14" font-weight="800" fill="#4d7c0f">B-</text>
    <text x="760" y="262" font-size="11" fill="#64748b">幻觉防护优秀，条款重复与结构冗余扣分</text>

    <text x="24" y="294" fill="#0f172a" font-weight="600">运界时间标准</text>
    <rect x="230" y="282" width="480" height="18" rx="4" fill="#f1f5f9"/>
    <rect x="230" y="282" width="288" height="18" rx="4" fill="#eab308"/>
    <text x="722" y="296" font-size="14" font-weight="800" fill="#a16207">C+</text>
    <text x="760" y="296" font-size="11" fill="#64748b">玄空未按立春，与八宅自相矛盾</text>

    <text x="24" y="328" fill="#0f172a" font-weight="600">知识声明透明度</text>
    <rect x="230" y="316" width="480" height="18" rx="4" fill="#f1f5f9"/>
    <rect x="230" y="316" width="288" height="18" rx="4" fill="#eab308"/>
    <text x="722" y="330" font-size="14" font-weight="800" fill="#a16207">C+</text>
    <text x="760" y="330" font-size="11" fill="#64748b">命卦口径 / 星性出处 / 记忆可信度均未声明</text>

    <text x="24" y="362" fill="#0f172a" font-weight="600">星性宜忌表达</text>
    <rect x="230" y="350" width="480" height="18" rx="4" fill="#f1f5f9"/>
    <rect x="230" y="350" width="240" height="18" rx="4" fill="#f97316"/>
    <text x="722" y="364" font-size="14" font-weight="800" fill="#c2410c">C</text>
    <text x="760" y="364" font-size="11" fill="#64748b">前端硬编码、无出处、生克方向有误</text>
  </g>

  <line x1="24" y1="392" x2="956" y2="392" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- 三层结论 -->
  <text x="24" y="420" font-size="13.5" font-weight="700" fill="#0f172a">三层结论</text>
  <g>
    <rect x="24" y="432" width="300" height="106" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.6"/>
    <text x="42" y="456" font-size="13" font-weight="800" fill="#15803d">算法层 · 专业</text>
    <text x="42" y="477" font-size="11.5" fill="#166534">同类开源实现中的上游水平，</text>
    <text x="42" y="494" font-size="11.5" fill="#166534">多处细节经得起对照，</text>
    <text x="42" y="511" font-size="11.5" fill="#166534">可与商业软件对盘。</text>
    <text x="42" y="530" font-size="11.5" font-weight="700" fill="#14532d">可与商业软件对盘</text>

    <rect x="340" y="432" width="300" height="106" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.6"/>
    <text x="358" y="456" font-size="13" font-weight="800" fill="#b45309">表达层 · 不专业</text>
    <text x="358" y="477" font-size="11.5" fill="#92400e">一处硬伤（生克方向反了）</text>
    <text x="358" y="494" font-size="11.5" fill="#92400e">一处方法论缺陷（运界不按立春）</text>
    <text x="358" y="511" font-size="11.5" fill="#92400e">一处口径缺失（命卦未声明流派）</text>
    <text x="358" y="530" font-size="11.5" font-weight="700" fill="#78350f">标注「非AI生成」实为误导</text>

    <rect x="656" y="432" width="300" height="106" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.6"/>
    <text x="674" y="456" font-size="13" font-weight="800" fill="#b91c1c">采集层 · 有致命缺陷</text>
    <text x="674" y="477" font-size="11.5" fill="#991b1b">坐向基准被采集过程污染，</text>
    <text x="674" y="494" font-size="11.5" fill="#991b1b">偏差 20°~45°，</text>
    <text x="674" y="511" font-size="11.5" fill="#991b1b">上层算得再准也无法挽回。</text>
    <text x="674" y="530" font-size="11.5" font-weight="700" fill="#7f1d1d">引擎精度被输入污染抵消</text>
  </g>
</svg>
