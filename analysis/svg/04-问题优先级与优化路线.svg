<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="980" height="600" fill="#ffffff"/>
  <text x="24" y="36" font-size="21" font-weight="700" fill="#0f172a">14 项问题优先级分布与三阶段优化路线</text>
  <text x="24" y="58" font-size="12.5" fill="#64748b">4 个 P0 / 6 个 P1 / 4 个 P2 · 全部已在本地复现或代码路径确认</text>

  <!-- left: priority buckets -->
  <text x="24" y="94" font-size="14" font-weight="700" fill="#0f172a">按优先级</text>

  <!-- P0 -->
  <rect x="24" y="106" width="300" height="152" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <circle cx="52" cy="136" r="14" fill="#dc2626"/>
  <text x="52" y="142" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">P0</text>
  <text x="76" y="133" font-size="15" font-weight="800" fill="#7f1d1d">4 项 · 致命</text>
  <text x="76" y="151" font-size="11.5" fill="#991b1b">直接导致排盘错误或功能不可达</text>
  <g font-size="11.5" fill="#7f1d1d">
    <text x="42" y="176">1· 采集污染坐向基准（index.html:778→794）</text>
    <text x="42" y="196">2· 请求体守卫 8MB &gt; 平台 4.5MB（api:36）</text>
    <text x="42" y="216">3· 室内模式无有效坐向来源（index:764-778）</text>
    <text x="42" y="236">4· 无 GPS 时罗盘模式完全不可用（api:148）</text>
  </g>

  <!-- P1 -->
  <rect x="24" y="270" width="300" height="152" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <circle cx="52" cy="300" r="14" fill="#d97706"/>
  <text x="52" y="306" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">P1</text>
  <text x="76" y="297" font-size="15" font-weight="800" fill="#78350f">6 项 · 严重</text>
  <text x="76" y="315" font-size="11.5" fill="#92400e">降级、污染、矛盾、安全</text>
  <g font-size="11.5" fill="#78350f">
    <text x="42" y="340">5 · 45s 看门狗误杀深度思考</text>
    <text x="42" y="360">6 · 思考流被当作正文输出</text>
    <text x="42" y="380">7 · 勘测记忆污染后续推理</text>
    <text x="42" y="400">8 · 九运/八运分界未按立春（引擎）</text>
    <text x="42" y="420">9 · 星性宜忌生克方向错误</text>
    <text x="42" y="440">10 · API 无鉴权无限流</text>
  </g>

  <!-- P2 -->
  <rect x="24" y="434" width="300" height="142" rx="10" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.8"/>
  <circle cx="52" cy="464" r="14" fill="#0284c7"/>
  <text x="52" y="470" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">P2</text>
  <text x="76" y="461" font-size="15" font-weight="800" fill="#075985">4 项 · 体验与工程</text>
  <text x="76" y="479" font-size="11.5" fill="#0369a1">不影响正确性，影响演进</text>
  <g font-size="11.5" fill="#075985">
    <text x="42" y="504">11 · DeepSeek 静默降级为盲算</text>
    <text x="42" y="524">12 · 单文件 1,233 行承载全部逻辑</text>
    <text x="42" y="544">13 · 引擎证据链被丢弃（8 字段）</text>
    <text x="42" y="564">14 · 提示词 K 条重复、编号乱序</text>
  </g>

  <!-- right: roadmap -->
  <text x="360" y="94" font-size="14" font-weight="700" fill="#0f172a">三阶段实施路线</text>

  <!-- phase 1 -->
  <rect x="360" y="106" width="596" height="140" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="378" y="130" font-size="14.5" font-weight="800" fill="#15803d">第一阶段 · 止血</text>
  <rect x="516" y="117" width="86" height="20" rx="10" fill="#dcfce7"/>
  <text x="559" y="132" font-size="11.5" font-weight="700" fill="#166534" text-anchor="middle">1~2 天</text>
  <text x="378" y="150" font-size="11.5" fill="#166534">7 处改动 · 合计约 23 行代码</text>
  <g font-size="11.3" fill="#14532d">
    <text x="378" y="172">① 冻结并使用 baseHeading（index.html ~5 行）</text>
    <text x="378" y="190">② 请求体守卫 8MB → 4MB（api/index.js 1 行）</text>
    <text x="378" y="208">③ 采集分辨率 720→512、质量 0.8→0.65（2 行）</text>
    <text x="640" y="172">④ 无 GPS 时自动切地图模式 + 提示（~8 行）</text>
    <text x="640" y="190">⑤ 删除重复的铁律 K（2 行）</text>
    <text x="640" y="208">⑥ fallbackUsed 时不写记忆、不入 history（~4 行）</text>
    <text x="378" y="230" fill="#15803d" font-weight="700">⑦ 修正 STAR_RULES 六白生克表述（1 行）</text>
  </g>

  <!-- phase 2 -->
  <rect x="360" y="258" width="596" height="140" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="378" y="282" font-size="14.5" font-weight="800" fill="#b45309">第二阶段 · 准确性加固</text>
  <rect x="540" y="269" width="86" height="20" rx="10" fill="#fef3c7"/>
  <text x="583" y="284" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle">3~5 天</text>
  <g font-size="11.3" fill="#78350f">
    <text x="378" y="304">⑧ 引擎加立春运界（改用 periodFromDate）</text>
    <text x="378" y="322">⑨ 命卦口径声明（method / sourceNote）</text>
    <text x="378" y="340">⑩ 测量不确定性透出（候选山向 + 复测提示）</text>
    <text x="378" y="358">⑪ 两级看门狗：首字节 60s / 无输出 30s</text>
    <text x="640" y="304">⑫ 室内模式强制复用室外已定向坐向</text>
    <text x="640" y="322">⑬ 记忆加 verified 标记，不可信不注入</text>
    <text x="640" y="340">⑭ 前端请求体预检，超限本地即提示</text>
  </g>

  <!-- phase 3 -->
  <rect x="360" y="410" width="596" height="120" rx="10" fill="#eef2ff" stroke="#818cf8" stroke-width="1.8"/>
  <text x="378" y="434" font-size="14.5" font-weight="800" fill="#4338ca">第三阶段 · 架构重构</text>
  <rect x="528" y="421" width="86" height="20" rx="10" fill="#e0e7ff"/>
  <text x="571" y="436" font-size="11.5" font-weight="700" fill="#3730a3" text-anchor="middle">1~2 周</text>
  <g font-size="11.3" fill="#3730a3">
    <text x="378" y="456">⑮ 拆分 index.html 为 7 个 ES modules</text>
    <text x="378" y="474">⑯ STAR_RULES 迁入引擎，每条标流派依据</text>
    <text x="378" y="492">⑰ API 限流 + 同源 Origin 校验</text>
    <text x="640" y="456">⑱ Playwright E2E 覆盖「采集→排盘」链路</text>
    <text x="640" y="474">⑲ 隐私政策与照片上传同意流程</text>
  </g>

  <!-- bottom: verdict -->
  <rect x="360" y="542" width="596" height="34" rx="8" fill="#0f172a"/>
  <text x="378" y="564" font-size="12.5" font-weight="700" fill="#fde68a">核心判断：引擎可信、表达不可信、采集有致命缺陷 —— 先做 7 行止血，再谈其他</text>
</svg>
