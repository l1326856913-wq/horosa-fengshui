<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" width="980" height="700" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="980" height="700" fill="#ffffff"/>
  <text x="24" y="36" font-size="21" font-weight="700" fill="#0f172a">知识专业性判伪矩阵：17 项逐条核验</text>
  <text x="24" y="58" font-size="12.5" fill="#64748b">判伪口径 · 源码逐行阅读 + 独立脚本实跑 + 通行典籍口径三源交叉</text>

  <!-- summary cards -->
  <g>
    <rect x="24" y="76" width="180" height="72" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.6"/>
    <text x="114" y="112" font-size="30" font-weight="800" fill="#15803d" text-anchor="middle">13</text>
    <text x="114" y="136" font-size="12.5" fill="#166534" text-anchor="middle">✅ 判伪通过</text>

    <rect x="216" y="76" width="180" height="72" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.6"/>
    <text x="306" y="112" font-size="30" font-weight="800" fill="#b91c1c" text-anchor="middle">2</text>
    <text x="306" y="136" font-size="12.5" fill="#991b1b" text-anchor="middle">❌ 不通过</text>

    <rect x="408" y="76" width="180" height="72" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.6"/>
    <text x="498" y="112" font-size="30" font-weight="800" fill="#b45309" text-anchor="middle">1</text>
    <text x="498" y="136" font-size="12.5" fill="#92400e" text-anchor="middle">⚠ 存疑/口径缺失</text>

    <rect x="600" y="76" width="180" height="72" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
    <text x="690" y="112" font-size="30" font-weight="800" fill="#0f172a" text-anchor="middle">1</text>
    <text x="690" y="136" font-size="12.5" fill="#475569" text-anchor="middle">已排除（伪疑点）</text>

    <rect x="792" y="76" width="164" height="72" rx="10" fill="#eef2ff" stroke="#818cf8" stroke-width="1.6"/>
    <text x="874" y="104" font-size="20" font-weight="800" fill="#4338ca" text-anchor="middle">A 级</text>
    <text x="874" y="126" font-size="12" fill="#3730a3" text-anchor="middle">飞星 / 八宅 / 紫白</text>
    <text x="874" y="142" font-size="12" fill="#3730a3" text-anchor="middle">算法层</text>
  </g>

  <!-- matrix header -->
  <rect x="24" y="166" width="932" height="34" rx="6" fill="#1e293b"/>
  <text x="40" y="188" font-size="12.5" font-weight="700" fill="#f8fafc">知识项</text>
  <text x="392" y="188" font-size="12.5" font-weight="700" fill="#f8fafc">引擎实现位置</text>
  <text x="676" y="188" font-size="12.5" font-weight="700" fill="#f8fafc">判定</text>
  <text x="790" y="188" font-size="12.5" font-weight="700" fill="#f8fafc">说明</text>

  <!-- rows -->
  <g font-size="11.5">
    <!-- 1 -->
    <rect x="24" y="204" width="932" height="26" fill="#f0fdf4"/>
    <text x="40" y="222" fill="#0f172a">二十四山分野（每山 15°、子山中心 0°）</text>
    <text x="392" y="222" fill="#475569" font-family="Consolas,monospace" font-size="11">getMountainFromDegree</text>
    <text x="676" y="222" fill="#15803d" font-weight="700">✅ 正确</text>
    <text x="790" y="222" fill="#166534">与《沈氏玄空学》一致</text>
    <!-- 2 -->
    <rect x="24" y="230" width="932" height="26" fill="#ffffff"/>
    <text x="40" y="248" fill="#0f172a">二十四山阴阳（地元/天元/人元）</text>
    <text x="392" y="248" fill="#475569" font-family="Consolas,monospace" font-size="11">mountains.ts YIN_YANG</text>
    <text x="676" y="248" fill="#15803d" font-weight="700">✅ 正确</text>
    <text x="790" y="248" fill="#166534">四正阳阴阴 / 四隅阴阳阳</text>
    <!-- 3 -->
    <rect x="24" y="256" width="932" height="26" fill="#f0fdf4"/>
    <text x="40" y="274" fill="#0f172a">飞星飞布路径（洛书顺逆）</text>
    <text x="392" y="274" fill="#475569" font-family="Consolas,monospace" font-size="11">flyChart offset=(luoshu-5)</text>
    <text x="676" y="274" fill="#15803d" font-weight="700">✅ 正确</text>
    <text x="790" y="274" fill="#166534">中→乾→兑→艮→离→坎→坤→震→巽</text>
    <!-- 4 highlight -->
    <rect x="24" y="282" width="932" height="26" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
    <text x="40" y="300" fill="#0f172a" font-weight="600">下卦顺逆判定（入中星本宫同元山定阴阳）</text>
    <text x="392" y="300" fill="#475569" font-family="Consolas,monospace" font-size="11">chart.ts directionFor()</text>
    <text x="676" y="300" fill="#15803d" font-weight="700">✅ 正确</text>
    <text x="790" y="300" fill="#166534">最见功力的部分</text>
    <!-- 5 -->
    <rect x="24" y="308" width="932" height="26" fill="#ffffff"/>
    <text x="40" y="326" fill="#0f172a">四正局型（旺山旺向/上山下水/双星到坐/到向）</text>
    <text x="392" y="326" fill="#475569" font-family="Consolas,monospace" font-size="11">classify() / classifyPlates()</text>
    <text x="676" y="326" fill="#15803d" font-weight="700">✅ 正确</text>
    <text x="790" y="326" fill="#166534">四种局型判定无误</text>
    <!-- 6 -->
    <rect x="24" y="334" width="932" height="26" fill="#f0fdf4"/>
    <text x="40" y="352" fill="#0f172a">父母三般卦（147 / 258 / 369）</text>
    <text x="392" y="352" fill="#475569" font-family="Consolas,monospace" font-size="11">isParentGroup</text>
    <text x="676" y="352" fill="#15803d" font-weight="700">✅ 正确</text>
    <text x="790" y="352" fill="#166534">分组正确</text>
    <!-- 7 -->
    <rect x="24" y="360" width="932" height="26" fill="#ffffff"/>
    <text x="40" y="378" fill="#0f172a">七星打劫（真：乾震离 / 假：坎巽兑）</text>
    <text x="392" y="378" fill="#475569" font-family="Consolas,monospace" font-size="11">TRUE_TRIAD / FALSE_TRIAD</text>
    <text x="676" y="378" fill="#15803d" font-weight="700">✅ 正确</text>
    <text x="790" y="378" fill="#166534">叠加「山星伏吟则不可用」</text>
    <!-- 8 -->
    <rect x="24" y="386" width="932" height="26" fill="#f0fdf4"/>
    <text x="40" y="404" fill="#0f172a">全盘伏吟 / 反吟、山星入囚</text>
    <text x="392" y="404" fill="#475569" font-family="Consolas,monospace" font-size="11">detectFanFuYin / detectRuQiu</text>
    <text x="676" y="404" fill="#15803d" font-weight="700">✅ 正确</text>
    <text x="790" y="404" fill="#166534">含全盘/单宫两态</text>
    <!-- 9 -->
    <rect x="24" y="412" width="932" height="26" fill="#ffffff"/>
    <text x="40" y="430" fill="#0f172a">替卦起星诀（沈氏二十四山替卦歌诀）</text>
    <text x="392" y="430" fill="#475569" font-family="Consolas,monospace" font-size="11">TWENTY_FOUR_MOUNTAIN_SUBSTITUTES</text>
    <text x="676" y="430" fill="#15803d" font-weight="700">✅ 逐字对应</text>
    <text x="790" y="430" fill="#166534">附 sourceUrl 可核查（罕见）</text>
    <!-- 10 -->
    <rect x="24" y="438" width="932" height="26" fill="#f0fdf4"/>
    <text x="40" y="456" fill="#0f172a">城门诀（向首两旁同元龙）</text>
    <text x="392" y="456" fill="#475569" font-family="Consolas,monospace" font-size="11">evaluateCastleGate</text>
    <text x="676" y="456" fill="#15803d" font-weight="700">✅ 正确</text>
    <text x="790" y="456" fill="#166534">前端只显示一句 summary</text>
    <!-- 11 -->
    <rect x="24" y="464" width="932" height="26" fill="#ffffff"/>
    <text x="40" y="482" fill="#0f172a">紫白流年入中（三元紫白九星逆计入中）</text>
    <text x="392" y="482" fill="#475569" font-family="Consolas,monospace" font-size="11">resolveYearFlyingStar</text>
    <text x="676" y="482" fill="#15803d" font-weight="700">✅ 正确</text>
    <text x="790" y="482" fill="#166534">实跑 2019-2036 严格递推</text>
    <!-- 12 -->
    <rect x="24" y="490" width="932" height="26" fill="#f0fdf4"/>
    <text x="40" y="508" fill="#0f172a">飞星旺 / 生 / 死 / 煞 / 退 五气</text>
    <text x="392" y="508" fill="#475569" font-family="Consolas,monospace" font-size="11">resolveFlyingStarYunState</text>
    <text x="676" y="508" fill="#15803d" font-weight="700">✅ 正确</text>
    <text x="790" y="508" fill="#166534">offset 0/1-2/3-4/5-7/8</text>
    <!-- 13 -->
    <rect x="24" y="516" width="932" height="26" fill="#ffffff"/>
    <text x="40" y="534" fill="#0f172a">八宅命卦换年（立春）</text>
    <text x="392" y="534" fill="#475569" font-family="Consolas,monospace" font-size="11">SolarTerm.fromIndex(y,3)</text>
    <text x="676" y="534" fill="#15803d" font-weight="700">✅ 正确</text>
    <text x="790" y="534" fill="#166534">与玄空运界自相矛盾 → 见 15</text>
    <!-- 14 excluded -->
    <rect x="24" y="542" width="932" height="26" fill="#f8fafc"/>
    <text x="40" y="560" fill="#64748b">立春比较的时间基准（疑点）</text>
    <text x="392" y="560" fill="#64748b" font-family="Consolas,monospace" font-size="11">createUtcTimestamp</text>
    <text x="676" y="560" fill="#64748b" font-weight="700">⊘ 已排除</text>
    <text x="790" y="560" fill="#64748b">两侧同源自洽，比较正确</text>
    <!-- 15 fail -->
    <rect x="24" y="568" width="932" height="26" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="40" y="586" fill="#991b1b" font-weight="700">九运 / 八运分界（未按立春）</text>
    <text x="392" y="586" fill="#7f1d1d" font-family="Consolas,monospace" font-size="11">resolveXuanKongPeriod</text>
    <text x="676" y="586" fill="#b91c1c" font-weight="700">❌ 未按立春</text>
    <text x="790" y="586" fill="#7f1d1d">引擎注释自己承认是近似</text>
    <!-- 16 fail -->
    <rect x="24" y="594" width="932" height="26" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="40" y="612" fill="#991b1b" font-weight="700">九星宜忌表（前端硬编码）</text>
    <text x="392" y="612" fill="#7f1d1d" font-family="Consolas,monospace" font-size="11">index.html STAR_RULES</text>
    <text x="676" y="612" fill="#b91c1c" font-weight="700">❌ 生克矛盾</text>
    <text x="790" y="612" fill="#7f1d1d">「火克金」方向写反</text>
    <!-- 17 warn -->
    <rect x="24" y="620" width="932" height="26" fill="#fffbeb"/>
  </g>
  <rect x="24" y="620" width="932" height="26" fill="#fffbeb"/>
  <text x="40" y="638" fill="#92400e" font-weight="700">命卦数算法口径（11−余数法 vs 数字和法）</text>
  <text x="392" y="638" fill="#92400e" font-family="Consolas,monospace" font-size="11">mingGua.js</text>
  <text x="676" y="638" fill="#b45309" font-weight="700">⚠ 口径未声明</text>
  <text x="790" y="638" fill="#92400e">6/6 样本与数字和法全不同</text>
</svg>
