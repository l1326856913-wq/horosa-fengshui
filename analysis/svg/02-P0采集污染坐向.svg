<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="980" height="640" fill="#ffffff"/>
  <text x="24" y="36" font-size="21" font-weight="700" fill="#0f172a">P0-1 缺陷复现：采集序列污染坐向基准</text>
  <text x="24" y="58" font-size="12.5" fill="#64748b">模拟 captureSequence() 的八方位顺时针排序逻辑 · 5 个基准角样本</text>

  <!-- code panel -->
  <rect x="24" y="76" width="500" height="176" rx="10" fill="#0f172a"/>
  <text x="40" y="100" font-size="12.5" font-weight="700" fill="#7dd3fc">public/index.html · lockAndAnalyze()</text>
  <g font-family="'Cascadia Code',Consolas,monospace" font-size="12">
    <text x="40" y="126" fill="#cbd5e1">isAnalyzing = <tspan fill="#fbbf24">true</tspan>;</text>
    <text x="40" y="148" fill="#94a3b8">// ① 记录基准（此刻 heading 正确）</text>
    <text x="40" y="168" fill="#fca5a5">appendLog(📍 基准锁定 <tspan fill="#fbbf24">${currentHeading}</tspan>…);</text>
    <text x="40" y="190" fill="#94a3b8">// ② 采集：改写 currentHeading ⚠</text>
    <text x="40" y="210" fill="#fca5a5">const cap = <tspan fill="#fbbf24">await captureSequence()</tspan>;</text>
    <text x="40" y="232" fill="#94a3b8">// ③ 读到的已是最后一个采集方位 ⚠</text>
  </g>
  <text x="40" y="252" fill="#f87171" font-size="12" font-weight="700">heading: currentHeading,   ← 坐向输入在此被污染</text>

  <!-- right explanation -->
  <rect x="548" y="76" width="408" height="176" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="568" y="101" font-size="13.5" font-weight="700" fill="#9a3412">captureSequence 内部（index.html:732）</text>
  <g font-size="11.8" fill="#7c2d12">
    <text x="568" y="126">· 按当前 heading 把八方位顺时针排序</text>
    <text x="568" y="147">· 逐个 ±12° 稳定 0.8s → captureFrame()</text>
    <text x="568" y="168">· 用户依次转完一圈，最后停在排序末位</text>
    <text x="568" y="196" font-weight="700" fill="#b91c1c">⇒ currentHeading 必然 ≠ 基准角</text>
    <text x="568" y="220">偏差范围 20°~45°，二十四山每山 15°</text>
    <text x="568" y="240" font-weight="700">⇒ 2~3 个山位系统性错判</text>
  </g>

  <!-- chart -->
  <text x="24" y="286" font-size="14" font-weight="700" fill="#0f172a">偏差实测（角度越高越危险）</text>
  <g font-size="11.5">
    <!-- header row -->
    <text x="30" y="312" fill="#64748b" font-weight="600">基准角</text>
    <text x="100" y="312" fill="#64748b" font-weight="600">山</text>
    <text x="150" y="312" fill="#64748b" font-weight="600">采集后 heading</text>
    <text x="290" y="312" fill="#64748b" font-weight="600">偏差</text>
    <text x="360" y="312" fill="#64748b" font-weight="600">错判山位</text>
    <text x="450" y="312" fill="#64748b" font-weight="600">偏差可视化（每格 5°）</text>
    <line x1="24" y1="320" x2="956" y2="320" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- row 1 -->
    <text x="30" y="347" fill="#0f172a" font-weight="600">0°</text>
    <text x="100" y="347" fill="#0f172a">子</text>
    <text x="150" y="347" fill="#0f172a">315°（乾）</text>
    <text x="290" y="347" fill="#dc2626" font-weight="700">45°</text>
    <text x="360" y="347" fill="#dc2626" font-weight="700">3 个</text>
    <rect x="450" y="333" width="450" height="18" rx="4" fill="#fee2e2"/>
    <rect x="450" y="333" width="450" height="18" rx="4" fill="#ef4444"/>
    <text x="908" y="347" fill="#7f1d1d" font-size="11">45</text>

    <!-- row 2 -->
    <text x="30" y="379" fill="#0f172a" font-weight="600">30°</text>
    <text x="100" y="379" fill="#0f172a">丑</text>
    <text x="150" y="379" fill="#0f172a">0°（子）</text>
    <text x="290" y="379" fill="#dc2626" font-weight="700">30°</text>
    <text x="360" y="379" fill="#dc2626" font-weight="700">2 个</text>
    <rect x="450" y="365" width="450" height="18" rx="4" fill="#fee2e2"/>
    <rect x="450" y="365" width="300" height="18" rx="4" fill="#f97316"/>
    <text x="758" y="379" fill="#9a3412" font-size="11">30</text>

    <!-- row 3 -->
    <text x="30" y="411" fill="#0f172a" font-weight="600">90°</text>
    <text x="100" y="411" fill="#0f172a">卯</text>
    <text x="150" y="411" fill="#0f172a">45°（艮）</text>
    <text x="290" y="411" fill="#dc2626" font-weight="700">45°</text>
    <text x="360" y="411" fill="#dc2626" font-weight="700">3 个</text>
    <rect x="450" y="397" width="450" height="18" rx="4" fill="#fee2e2"/>
    <rect x="450" y="397" width="450" height="18" rx="4" fill="#ef4444"/>
    <text x="908" y="411" fill="#7f1d1d" font-size="11">45</text>

    <!-- row 4 -->
    <text x="30" y="443" fill="#0f172a" font-weight="600">200°</text>
    <text x="100" y="443" fill="#0f172a">丁</text>
    <text x="150" y="443" fill="#0f172a">180°（午）</text>
    <text x="290" y="443" fill="#ea580c" font-weight="700">20°</text>
    <text x="360" y="443" fill="#ea580c" font-weight="700">1~2 个</text>
    <rect x="450" y="429" width="450" height="18" rx="4" fill="#fff7ed"/>
    <rect x="450" y="429" width="200" height="18" rx="4" fill="#fbbf24"/>
    <text x="658" y="443" fill="#92400e" font-size="11">20</text>

    <!-- row 5 -->
    <text x="30" y="475" fill="#0f172a" font-weight="600">275°</text>
    <text x="100" y="475" fill="#0f172a">酉</text>
    <text x="150" y="475" fill="#0f172a">270°（酉）</text>
    <text x="290" y="475" fill="#16a34a" font-weight="700">5°</text>
    <text x="360" y="475" fill="#16a34a" font-weight="700">0 个</text>
    <rect x="450" y="461" width="450" height="18" rx="4" fill="#f0fdf4"/>
    <rect x="450" y="461" width="50" height="18" rx="4" fill="#4ade80"/>
    <text x="508" y="475" fill="#166534" font-size="11">5</text>
  </g>

  <line x1="24" y1="498" x2="956" y2="498" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- why invisible -->
  <text x="24" y="524" font-size="14" font-weight="700" fill="#0f172a">为什么用户完全看不出来？</text>
  <g font-size="11.8">
    <rect x="24" y="536" width="300" height="82" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="38" y="556" font-weight="700" fill="#0f172a">1 · 界面覆盖</text>
    <text x="38" y="575" fill="#475569">headingVal 显示最后一个方位角，</text>
    <text x="38" y="592" fill="#475569">但 mountain-name 已被排盘结果</text>
    <text x="38" y="609" fill="#475569">覆盖为「×山(排盘)」字样</text>

    <rect x="340" y="536" width="300" height="82" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="354" y="556" font-weight="700" fill="#0f172a">2 · 引擎无异常</text>
    <text x="354" y="575" fill="#475569">对错误 heading 与正确 heading</text>
    <text x="354" y="592" fill="#475569">处理完全相同；不落分界线附近</text>
    <text x="354" y="609" fill="#475569">就正常返回，无任何 warn</text>

    <rect x="656" y="536" width="300" height="82" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="670" y="556" font-weight="700" fill="#991b1b">3 · 错误被三重包装</text>
    <text x="670" y="575" fill="#7f1d1d">九宫格金色高亮 + 五黄红色标注</text>
    <text x="670" y="592" fill="#7f1d1d">+ 铁律强制 AI 复述数字</text>
    <text x="670" y="609" fill="#7f1d1d">+ 幻觉核对亮「一致」黄牌</text>
  </g>
</svg>
