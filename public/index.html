<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Horosa AR</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --glass-bg: rgba(10, 10, 12, 0.65);
            --gold: #D4AF37;
            --text-main: #EAEAEA;
            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }
        
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-main);
        }

        #camera-view {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1;
        }

        #hud-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
        }

        .top-panel {
            margin-top: var(--safe-top); margin-left: 16px; margin-right: 16px; padding: 16px;
            background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-radius: 16px; border: 1px solid rgba(212, 175, 55, 0.3);
            display: flex; justify-content: space-between; align-items: center; position: relative;
        }

        .heading-display { font-size: 2.5rem; font-weight: 200; color: var(--gold); font-variant-numeric: tabular-nums; }
        .mountains-display { font-size: 1.2rem; text-align: right; }

        .center-reticle {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 200px; height: 200px; border: 1px solid rgba(212, 175, 55, 0.5); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
        }
        .center-reticle::before, .center-reticle::after {
            content: ''; position: absolute; background: rgba(212, 175, 55, 0.8);
        }
        .center-reticle::before { width: 10px; height: 1px; }
        .center-reticle::after { width: 1px; height: 10px; }

        .bottom-panel {
            margin-bottom: var(--safe-bottom); margin-left: 16px; margin-right: 16px; padding: 20px;
            background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-radius: 16px; border: 1px solid rgba(212, 175, 55, 0.3);
            min-height: 120px; max-height: 30vh; overflow-y: auto; pointer-events: auto;
        }

        .typewriter { font-size: 1rem; line-height: 1.6; color: var(--text-main); }
        .typewriter span.gold { color: var(--gold); }

        #auth-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000;
            z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        .btn-gold {
            background: transparent; color: var(--gold); border: 1px solid var(--gold);
            padding: 12px 32px; font-size: 1.2rem; border-radius: 24px; margin-top: 20px; cursor: pointer; pointer-events: auto;
        }
        
        #capture-canvas { display: none; }
        
        .status-indicator {
            position: absolute; top: -10px; right: -10px; width: 10px; height: 10px;
            border-radius: 50%; background: #ff3b30; box-shadow: 0 0 8px #ff3b30;
        }
        .status-indicator.analyzing { background: #ffcc00; box-shadow: 0 0 8px #ffcc00; }
        .status-indicator.connected { background: #34c759; box-shadow: 0 0 8px #34c759; }
        
        .provider-select {
            background: transparent; color: var(--gold); border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 8px; padding: 4px; margin-top: 8px; font-size: 0.9rem; outline: none; pointer-events: auto;
        }
        .provider-select option { background: #000; }

        /* 设置面板 */
        .settings-btn {
            position: absolute; top: 16px; right: 16px; width: 32px; height: 32px;
            background: transparent; border: none; color: var(--gold); font-size: 1.5rem;
            cursor: pointer; pointer-events: auto; z-index: 10; display: flex; align-items: center; justify-content: center;
        }
        #settings-modal {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 999; justify-content: center; align-items: center; pointer-events: auto;
        }
        .settings-content {
            background: #111; border: 1px solid var(--gold); border-radius: 16px; padding: 24px; width: 80%; max-width: 350px;
        }
        .settings-content h2 { color: var(--gold); margin-top: 0; font-weight: 300; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; color: #aaa; margin-bottom: 4px; font-size: 0.9rem; }
        .input-group input {
            width: 100%; background: #222; border: 1px solid #444; color: #fff;
            padding: 8px; border-radius: 8px; box-sizing: border-box;
        }
        .btn-row { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
        .btn-small { padding: 8px 16px; border-radius: 16px; border: 1px solid var(--gold); background: transparent; color: var(--gold); cursor: pointer; }
        .btn-solid { background: var(--gold); color: #000; font-weight: bold; }
    </style>
</head>
<body>

    <!-- 授权层 -->
    <div id="auth-overlay">
        <h1 style="color: var(--gold); font-weight: 300;">Horosa AR</h1>
        <p style="color: #888;">需要相机与罗盘权限</p>
        <button class="btn-gold" id="start-btn">开启堪舆</button>
    </div>

    <!-- 视频流 -->
    <video id="camera-view" autoplay playsinline muted></video>
    <canvas id="capture-canvas"></canvas>

    <!-- 设置按钮与面板 -->
    <button class="settings-btn" id="open-settings-btn">⚙️</button>
    <div id="settings-modal">
        <div class="settings-content">
            <h2>API Key 设置 (本地保存)</h2>
            <div class="input-group">
                <label>Gemini API Key</label>
                <input type="password" id="key-gemini" placeholder="AIzaSy...">
            </div>
            <div class="input-group">
                <label>DeepSeek API Key</label>
                <input type="password" id="key-deepseek" placeholder="sk-...">
            </div>
            <div class="input-group">
                <label>Zhipu GLM API Key</label>
                <input type="password" id="key-glm" placeholder="...">
            </div>
            <div class="btn-row">
                <button class="btn-small" id="close-settings-btn">取消</button>
                <button class="btn-small btn-solid" id="save-settings-btn">保存</button>
            </div>
        </div>
    </div>

    <!-- AR HUD -->
    <div id="hud-container">
        <div class="top-panel">
            <div class="status-indicator" id="status-dot"></div>
            <div>
                <div class="heading-display"><span id="heading-val">0</span>°</div>
                <select class="provider-select" id="ai-provider">
                    <option value="gemini">Gemini 3.1 Pro</option>
                    <option value="deepseek">DeepSeek</option>
                    <option value="glm">Zhipu GLM-5</option>
                </select>
            </div>
            <div class="mountains-display">
                <div id="mountain-name" style="color: var(--gold); font-size: 1.5rem; margin-bottom: 4px;">--山</div>
                <div id="gua-name" style="font-size: 1rem; color: #888;">正在获取方位...</div>
            </div>
        </div>

        <div class="center-reticle" id="reticle"></div>

        <div class="bottom-panel" id="log-panel">
            <div class="typewriter" id="typewriter-text">等待罗盘稳定...</div>
        </div>
    </div>

    <script>
        // 核心提示词升级，支持大小峦头合参
        const SYSTEM_INSTRUCTION = `你是一位精通中国传统堪舆学（三元玄空飞星、八宅明镜、形势峦头）的建筑环境学大师。
系统会给你输入两张图：【图1】是手机摄像头拍下的室内/实景照片（代表小峦头）；如果有【图2】，则是基于用户 GPS 定位获取的周边街道俯瞰地图（代表大峦头）。
你的分析必须极其专业，融合大小峦头与理气：
1. 【大峦头（外局）】：如果提供了地图，观察房屋周边的“水”（现代城市的道路即是水）、“山”（周边高大建筑）。判断是否有路冲煞、反弓水、玉带环腰等外部大格局。
2. 【小峦头（内局）】：审视实景照片，寻找门、窗、走廊、横梁、尖角煞等内部形煞。
3. 【高阶理气排盘】：在心中排出九宫飞星盘。结合大峦头的道路走向与小峦头的窗户位置，判断星盘的“当旺向星”是否见水（路/窗），“当旺山星”是否见山（高楼/实墙），评判“收山出煞”是否得当。
4. 【化解与布局】：根据现代室内设计美学，提供内外局结合的化解或催旺建议。
输出要求：排版清晰，条理分明，大师风范。`;

        const video = document.getElementById('camera-view');
        const canvas = document.getElementById('capture-canvas');
        const headingVal = document.getElementById('heading-val');
        const typewriterText = document.getElementById('typewriter-text');
        const startBtn = document.getElementById('start-btn');
        const authOverlay = document.getElementById('auth-overlay');
        const statusDot = document.getElementById('status-dot');
        const providerSelect = document.getElementById('ai-provider');
        const logPanel = document.getElementById('log-panel');
        
        const settingsModal = document.getElementById('settings-modal');
        const openSettingsBtn = document.getElementById('open-settings-btn');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const saveSettingsBtn = document.getElementById('save-settings-btn');

        document.getElementById('key-gemini').value = localStorage.getItem('GEMINI_KEY') || '';
        document.getElementById('key-deepseek').value = localStorage.getItem('DEEPSEEK_KEY') || '';
        document.getElementById('key-glm').value = localStorage.getItem('GLM_KEY') || '';
        
        // 新增地图 Key
        const mapGroup = document.createElement('div');
        mapGroup.className = 'input-group';
        mapGroup.innerHTML = '<label>高德地图 Web API Key (可选)</label><input type="password" id="key-gaode" placeholder="用于获取周边大峦头地形...">';
        document.querySelector('.settings-content').insertBefore(mapGroup, document.querySelector('.btn-row'));
        document.getElementById('key-gaode').value = localStorage.getItem('GAODE_KEY') || '';

        openSettingsBtn.onclick = () => settingsModal.style.display = 'flex';
        closeSettingsBtn.onclick = () => settingsModal.style.display = 'none';
        saveSettingsBtn.onclick = () => {
            localStorage.setItem('GEMINI_KEY', document.getElementById('key-gemini').value.trim());
            localStorage.setItem('DEEPSEEK_KEY', document.getElementById('key-deepseek').value.trim());
            localStorage.setItem('GLM_KEY', document.getElementById('key-glm').value.trim());
            localStorage.setItem('GAODE_KEY', document.getElementById('key-gaode').value.trim());
            settingsModal.style.display = 'none';
        };

        function getApiKey(provider) {
            if(provider === 'gemini') return localStorage.getItem('GEMINI_KEY');
            if(provider === 'deepseek') return localStorage.getItem('DEEPSEEK_KEY');
            if(provider === 'glm') return localStorage.getItem('GLM_KEY');
            return null;
        }

        let currentHeading = 0;
        let smoothedHeading = 0;
        const EMA_ALPHA = 0.1; 
        
        let isAnalyzing = false;
        let stableTimer = null;
        let lastStableHeading = null;
        const STABLE_THRESHOLD = 3; 
        const STABLE_TIME = 1500; 

        // GPS 定位变量
        let userLat = null;
        let userLng = null;

        const mountains = ["子", "癸", "丑", "艮", "寅", "甲", "卯", "乙", "辰", "巽", "巳", "丙", "午", "丁", "未", "坤", "申", "庚", "酉", "辛", "戌", "乾", "亥", "壬"];
        function getMountain(heading) {
            let index = Math.floor(((heading + 7.5) % 360) / 15);
            return mountains[index];
        }

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } } });
                video.srcObject = stream;
            } catch (err) {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
            }
        }

        function handleOrientation(event) {
            let heading = event.webkitCompassHeading || (360 - event.alpha) || 0;
            if (smoothedHeading === 0) smoothedHeading = heading;
            else {
                let diff = heading - smoothedHeading;
                if (diff > 180) diff -= 360;
                if (diff < -180) diff += 360;
                smoothedHeading = (smoothedHeading + diff * EMA_ALPHA) % 360;
                if (smoothedHeading < 0) smoothedHeading += 360;
            }
            currentHeading = smoothedHeading;
            headingVal.innerText = currentHeading.toFixed(1);
            document.getElementById('mountain-name').innerText = getMountain(currentHeading) + "山";
            checkStability();
        }

        function checkStability() {
            if (isAnalyzing || settingsModal.style.display === 'flex') return;
            if (lastStableHeading === null || Math.abs(currentHeading - lastStableHeading) > STABLE_THRESHOLD) {
                lastStableHeading = currentHeading;
                clearTimeout(stableTimer);
                statusDot.className = 'status-indicator connected';
                stableTimer = setTimeout(triggerAnalysis, STABLE_TIME);
            }
        }

        function captureFrame() {
            canvas.width = 720; 
            canvas.height = (video.videoHeight / video.videoWidth) * 720 || 1280;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
        }

        async function readOpenAIStream(response) {
            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                const chunk = decoder.decode(value, {stream: true});
                const lines = chunk.split('\n');
                for (const line of lines) {
                    if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                        try {
                            const data = JSON.parse(line.slice(6));
                            if (data.choices && data.choices[0].delta && data.choices[0].delta.content) {
                                typewriterText.innerHTML += data.choices[0].delta.content.replace(/\n/g, '<br>');
                                logPanel.scrollTop = logPanel.scrollHeight;
                            }
                        } catch (e) {}
                    }
                }
            }
        }

        async function readGeminiStream(response) {
            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                const chunk = decoder.decode(value, {stream: true});
                try {
                    const matches = chunk.match(/"text":\s*"([^"]+)"/g);
                    if (matches) {
                        matches.forEach(m => {
                            let text = JSON.parse(`{${m}}`).text;
                            typewriterText.innerHTML += text.replace(/\n/g, '<br>');
                            logPanel.scrollTop = logPanel.scrollHeight;
                        });
                    }
                } catch(e){}
            }
        }

        async function triggerAnalysis() {
            const provider = providerSelect.value;
            const apiKey = getApiKey(provider);
            const gaodeKey = localStorage.getItem('GAODE_KEY');
            
            if (!apiKey) {
                typewriterText.innerHTML = `<span style="color:red">请先点击右上角 ⚙️ 配置 API Key</span>`;
                return;
            }

            isAnalyzing = true;
            statusDot.className = 'status-indicator analyzing';
            typewriterText.innerHTML = "获取排盘数据中...<br>";
            
            const frameBase64 = captureFrame();
            let mapBase64 = null;

            try {
                // 1. 获取后端理气排盘
                const horosaRes = await fetch('/api/horosa', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ heading: currentHeading, year: new Date().getFullYear() })
                });
                const horosaData = await horosaRes.json();
                
                // 2. 如果有经纬度和高德 Key，请求代理获取地图图片
                if (userLat && userLng && gaodeKey) {
                    typewriterText.innerHTML += "提取周边大峦头地形...<br>";
                    const mapRes = await fetch('/api/map', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ lat: userLat, lng: userLng, gaode_key: gaodeKey })
                    });
                    const mapData = await mapRes.json();
                    if (mapData.status === 'success') {
                        mapBase64 = mapData.image_base64;
                    }
                }

                typewriterText.innerHTML += "内外局峦理合参开始...<br>";
                typewriterText.innerHTML += `<span class="gold">[${provider.toUpperCase()}]</span><br>`;

                const promptText = `理气排盘数据：\n${JSON.stringify(horosaData.data, null, 2)}\n\n请结合图片（图1为内部小峦头${mapBase64 ? '，图2为外部地形大峦头' : ''}）与理气数据，给出具体的吉凶研判与布局建议。`;

                // 构建图片阵列
                let imageParts = [];
                // Gemini 格式
                let geminiParts = [{ text: promptText }, { inlineData: { mimeType: "image/jpeg", data: frameBase64 } }];
                // OpenAI 格式
                let openaiContent = [{ type: "text", text: promptText }, { type: "image_url", image_url: { url: `data:image/jpeg;base64,${frameBase64}` } }];

                if (mapBase64) {
                    geminiParts.push({ inlineData: { mimeType: "image/jpeg", data: mapBase64 } });
                    openaiContent.push({ type: "image_url", image_url: { url: `data:image/jpeg;base64,${mapBase64}` } });
                }

                if (provider === 'gemini') {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:streamGenerateContent?alt=sse&key=${apiKey}`;
                    const payload = {
                        systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
                        contents: [{ parts: geminiParts }]
                    };
                    const aiRes = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (!aiRes.ok) throw new Error("Gemini API 请求失败");
                    await readGeminiStream(aiRes);
                } else {
                    const url = provider === 'deepseek' ? 'https://api.deepseek.com/v1/chat/completions' : 'https://open.bigmodel.cn/api/paas/v4/chat/completions';
                    const modelName = provider === 'deepseek' ? 'deepseek-chat' : 'glm-4v';
                    const payload = {
                        model: modelName,
                        stream: true,
                        messages: [
                            { role: "system", content: SYSTEM_INSTRUCTION },
                            { role: "user", content: openaiContent }
                        ]
                    };
                    const aiRes = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                        body: JSON.stringify(payload)
                    });
                    if (!aiRes.ok) throw new Error(`${provider} API 请求失败`);
                    await readOpenAIStream(aiRes);
                }
            } catch (err) {
                typewriterText.innerHTML += `<br><span style="color:red">错误: ${err.message}</span>`;
            }
            
            statusDot.className = 'status-indicator connected';
            setTimeout(() => { isAnalyzing = false; lastStableHeading = null; }, 5000);
        }

        startBtn.addEventListener('click', async () => {
            // 请求 GPS 权限
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => { userLat = pos.coords.latitude; userLng = pos.coords.longitude; },
                    err => { console.warn("GPS 定位被拒绝或失败", err); }
                );
            }

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState === 'granted') window.addEventListener('deviceorientation', handleOrientation);
                    else alert("罗盘权限被拒绝");
                } catch (error) { console.error(error); }
            } else {
                window.addEventListener('deviceorientationabsolute', handleOrientation);
            }
            await initCamera();
            authOverlay.style.display = 'none';
        });
    </script>
</body>
</html>
